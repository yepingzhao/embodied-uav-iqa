seed_everything: 42
model:
  backbone: efficientvit_b0
  num_tasks: 4
  use_fab: true
  use_cbam: true
  use_task_conditioning: true
  freeze_backbone_stage: 2
  lambda_rank: 0.3
  lambda_cross_task: 0.1
  lr: 0.0012
  weight_decay: 0.0001
  warmup_epochs: 5
  total_epochs: 50
  annotator_stage: vla
data:
  data_root: data/processed
  batch_size: 256
  num_workers: 16
  image_size: 256
  annotator_stage: vla
  task: null
  val_task: null
  distortion_filter: null
  leave_out_task: null
  dry_run: false
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  enable_progress_bar: true
  default_root_dir: outputs/r020_efficientvit_b0
  logger:
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs
      name: r020_efficientvit_b0
  - class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: uav-iqa
      name: r020_efficientvit_b0
      save_dir: outputs/r020_efficientvit_b0
  callbacks:
  - class_path: uav_iqa.callbacks.SetupRunCallback
  - class_path: uav_iqa.callbacks.CurriculumStageCallback
    init_args:
      vlm_epochs: 20
      vla_epochs: 20
      execution_epochs: 10
  - class_path: uav_iqa.callbacks.MetricsHistoryCallback
  - class_path: uav_iqa.callbacks.ResultsSavingCallback
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: epoch_{epoch:03d}
      every_n_epochs: 5
      save_top_k: -1
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: best_{val/srcc:.4f}
      monitor: val/srcc
      mode: max
      save_top_k: 1
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: last
      save_last: true
