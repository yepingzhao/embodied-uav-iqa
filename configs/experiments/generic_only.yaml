seed_everything: 42
model:
  backbone: mobilenetv4_conv_small
  num_tasks: 14
  use_frequency_encoder: true
  use_spatial_attention: true
  use_task_conditioning: true
  freeze_backbone_stage: 2
  lambda_rank: 0.3
  lambda_cross_task: 0.1
  lr: 0.0012
  weight_decay: 0.0001
  warmup_epochs: 5
  total_epochs: 50
data:
  data_root: data/processed
  batch_size: 256
  num_workers: 16
  image_size: 256
  subtask_filter: null  # all 14 subtasks
  distortion_filter: generic
  dry_run: false
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  enable_progress_bar: true
  default_root_dir: outputs/generic_only
  logger:
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs
      name: generic_only
  - class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: uav-iqa
      name: generic_only
      save_dir: outputs/generic_only
  callbacks:
  - class_path: uav_iqa.training.SetupRunCallback
  - class_path: uav_iqa.training.MetricsHistoryCallback
  - class_path: uav_iqa.training.ResultsSavingCallback
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: epoch_{epoch:03d}
      every_n_epochs: 5
      save_top_k: -1
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: best_{val/srcc:.4f}
      monitor: val/srcc
      mode: max
      save_top_k: 1
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: last
      save_last: true
