seed_everything: 42
model:
  class_path: uav_iqa.lightning_module.UAVIQALightningModule
  init_args:
    backbone: mobilenetv4_conv_small
    num_tasks: 4
    use_fab: true
    use_cbam: true
    use_task_conditioning: true
    freeze_backbone_stage: 2
    lambda_rank: 0.3
    lambda_cross_task: 0.1
    lr: 0.0012
    weight_decay: 0.0001
    warmup_epochs: 5
    total_epochs: 50
    annotator_stage: vla
data:
  class_path: uav_iqa.data_module.UAVIQDataModule
  init_args:
    data_root: data/processed
    batch_size: 256
    num_workers: 16
    image_size: 256
    annotator_stage: vla
    task: null
    val_task: null
    distortion_filter: null
    leave_out_task: null
    dry_run: false
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  enable_progress_bar: true
  logger:
  - class_path: swanlab.integration.pytorch_lightning.SwanLabLogger
    init_args:
      project: uav-iqa
  - class_path: lightning.pytorch.loggers.CSVLogger
    init_args: {}
  callbacks:
  - class_path: uav_iqa.callbacks.SetupRunCallback
  - class_path: uav_iqa.callbacks.CurriculumStageCallback
    init_args:
      vlm_epochs: 20
      vla_epochs: 20
      execution_epochs: 10
  - class_path: uav_iqa.callbacks.MetricsHistoryCallback
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val/srcc
      mode: max
      save_top_k: 1
      filename: best_model
  - class_path: uav_iqa.callbacks.ResultsSavingCallback
  default_root_dir: outputs/r013_task_cond
