[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-iqa"
version = "0.1.0"
description = "UAV-Embodied-IQA: Visual Quality Assessment for Aerial Embodied Intelligence"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UAV-Embodied-IQA Team"},
]
dependencies = [
    "torch>=2.1.0,<2.11",
    "torchvision>=0.16.0,<0.26",
    "lightning>=2.0.0",
    "jsonargparse[signatures]>=4.27",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    "albumentations>=1.3.0",
    "timm>=0.9.0",
    "pyyaml>=6.0",
    "pyiqa>=0.1.15.post2",
    "python-dotenv>=1.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
vlm = [
    "vllm>=0.4.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "nvidia-cudnn-cu12",
]
benchmark = [
    "pyiqa>=0.1.0",
]
swanlab = [
    "swanlab>=0.3.0",
]
wandb = [
    "wandb>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.uv]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: slow or resource-intensive smoke/end-to-end tests",
    "gpu: tests that require a CUDA-capable GPU",
]
filterwarnings = [
    "ignore",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
